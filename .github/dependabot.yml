version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Stay on the reviewed Node LTS line; runtime-major upgrades are deliberate.
      - dependency-name: node
        update-types:
          - version-update:semver-major
